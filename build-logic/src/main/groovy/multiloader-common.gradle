plugins {
    id("java-library")
    id("maven-publish")
    id("idea")
    id("pmd")
    id("com.diffplug.spotless")
    id("package-info")
}

base {
    archivesName = "${mod_id}-${project.name.toLowerCase()}-${minecraft_version}"
    version = build_number
    if (System.getenv().RELEASE_MODE != "1") {
        version += "-SNAPSHOT"
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    // withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.compilerArgs << "-Xmaxerrs" << "2000"
}

tasks.withType(Javadoc).configureEach {
    options.jFlags(
            "-Duser.language=en",
            "-Duser.country=us"
    )

    // for some reason these officially used tags never made it into the default configuration of the Javadoc tool
    options.tags(
            'apiNote:a:API Note:',
            'implSpec:a:Implementation Requirements:',
            'implNote:a:Implementation Note:'
    )
    // (This method is weird. It won't work without a second string parameter, so we use something reasonably harmless.)
    options.addStringOption("Xdoclint:all,-missing", "-quiet")
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = "Sponge"
                url = "https://repo.spongepowered.org/repository/maven-public"
            }
        }
        filter { includeGroupAndSubgroups("org.spongepowered") }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = "ParchmentMC"
                    url = "https://maven.parchmentmc.org/"
                },
                maven {
                    name = "NeoForge"
                    url = "https://maven.neoforged.net/releases"
                }
        )
        filter { includeGroup("org.parchmentmc.data") }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "LatvianModder"
        url = "https://maven.latvian.dev/releases"
        content {
            // KubeJS itself and its transitive helpers (rhino, tiny-java-server)
            includeGroup("dev.latvian.mods")
            includeGroup("dev.latvian.apps")
        }
    }
    maven {
        name = "Jitpack"
        url = "https://jitpack.io"
        content {
            // transitive of KubeJS (animated gif writer used by its texture tooling)
            includeGroup("com.github.rtyley")
        }
    }
    maven {
        name = "Sleeping Town"
        url = "https://repo.sleeping.town/" // for emi, trinkets, and ears
        content {
            includeGroup("com.unascribed")
            includeGroup("dev.emi")
        }
    }
    maven {
        url = "https://maven.shedaniel.me/" // for rei
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven" // for "here be no dragons", and Sodium/Embeddium
        content {
            includeGroup "maven.modrinth"
        }
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
["apiElements", "runtimeElements", "sourcesElements"/*, "javadocElements"*/].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name.toLowerCase()}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourceSets.main.resources {
    srcDir("src/generated/resources")
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    exclude("**/*.bat")
    exclude("**/*.psd")
    exclude("**/*.ase")
    exclude("**/*.exe")
    exclude("**/unused")

    exclude(".cache")
    exclude("assets/botania/patchouli_books/lexica_botania/en_us/README")

    manifest {
        attributes([
                "Specification-Title"   : mod_name,
                "Specification-Vendor"  : mod_author,
                "Specification-Version" : project.jar.archiveVersion,
                "Implementation-Title"  : project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor" : mod_author,
                "Built-On-Minecraft"    : minecraft_version
        ])
    }
}

sourcesJar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }

    // Exclude datagenerator .cache directory
    exclude(".cache")
}

processResources {
    from("../contributors.properties")
    // Exclude datagenerator .cache directory
    exclude(".cache")

    var expandProps = [
            "version"                      : version,
            "build_number"                 : build_number,
            "group"                        : project.group, //Else we target the task's group.
            "minecraft_version"            : minecraft_version,
            "mod_name"                     : mod_name,
            "mod_author"                   : mod_author,
            "mod_id"                       : mod_id,
            "license"                      : license,
            "description"                  : project.description,
            "website_url"                  : website_url,
            "sources_url"                  : sources_url,
            "issues_url"                   : issue_url,
            "neoforge_version"             : neoforge_version,
            "neoforge_loader_version_range": neoforge_loader_version_range,
            "java_version"                 : java_version,
            "gog_version"                  : gog_version
    ]

    filesMatching(["pack.mcmeta", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
        expand(expandProps)
    }
    // The book's metadata carries the mod version as a literal ${build_number}.
    // Two things about this one, both of which had it silently doing nothing:
    //
    //   - the path was still "patchouli_books/lexicon/" after the book was
    //     renamed to lexica_botania, so filesMatching never matched it;
    //   - the search token has to be single quoted. In a double quoted Groovy
    //     string "${build_number}" is interpolated when this script is compiled,
    //     so it looked for the version's own text (say "1.0.0") in a file that
    //     contains the placeholder, and replaced nothing.
    //
    // expand() is not an option either: it templates the whole file through the
    // Groovy engine, which fails on this JSON.
    filesMatching("data/botania/patchouli_books/lexica_botania/book.json") {
        filter { it.replace('${build_number}', build_number) }
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            artifactId = base.archivesName.get()
            from(components.java)
        }
    }
    repositories {
        maven {
            url = System.getenv("local_maven_url")
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

pmd {
    toolVersion = "7.27.0"
    incrementalAnalysis = true
    ruleSetFiles = rootProject.files("spotless/pmd-ruleset.xml")
    consoleOutput = true
}

spotless {
    enforceCheck = false // workaround around jenkins having wrong line endings in some files
    // we explicitly check in github actions builds
    java {
        indentWithTabs()
        eclipse().configFile rootProject.file("spotless/eclipseformat.xml")
        removeUnusedImports()
        importOrderFile rootProject.file("spotless/eclipse.importorder")
    }
}
